services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/analytics/models:/app/app/analytics/models
      - ./backend/flexifees.db:/app/flexifees.db

  dashboard:
    image: python:3.12-slim
    working_dir: /app
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app
    command: >
      sh -c "pip install streamlit requests pandas plotly streamlit-autorefresh scikit-learn joblib && 
             streamlit run app/analytics/dashboard/dashboard.py --server.port 8501 --server.address 0.0.0.0"
    ports:
      - "8501:8501"
    depends_on:
      - backend